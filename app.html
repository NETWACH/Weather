<!DOCTYPE html>
<html lang="en">
<head>
    <title>Arc Void | Secure Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --glass: rgba(255, 255, 255, 0.08); --cyan: #00f2ff; --silver: #c0c0c0; }
        body, html { height: 100%; margin: 0; background: #050508; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

        /* Moving Bubbles Background */
        .bubble-bg {
            position: fixed; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 50%, #111122 0%, #050508 100%);
            z-index: -1;
        }
        .bubble-bg::after {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: radial-gradient(circle, rgba(0, 242, 255, 0.04) 10%, transparent 10.5%);
            background-size: 120px 120px;
            animation: bubbleMove 80s linear infinite;
        }
        @keyframes bubbleMove { from { transform: translate(0,0); } to { transform: translate(-120px, -120px); } }

        .mono { font-family: monospace; color: var(--cyan); }
        
        /* Layout Containers */
        #dashboard { display: none; padding-top: 50px; }
        .web-window { 
            background: var(--glass); backdrop-filter: blur(40px); 
            border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; 
            color: #fff; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .data-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(192, 192, 192, 0.2);
            padding: 20px; border-radius: 8px;
        }

        /* Metallic Login Border */
        .login-box { border: 1px solid var(--silver); }
    </style>
</head>
<body>
    <div class="bubble-bg"></div>

    <section id="gate" class="h-100 d-flex align-items-center justify-content-center">
        <div class="web-window login-box text-center" style="width: 400px;">
            <h2 class="mb-4" style="letter-spacing: 8px;">ARC VOID</h2>
            <div class="form-group"><input type="email" id="email" class="form-control bg-transparent text-white" placeholder="Email"></div>
            <div class="form-group"><input type="password" id="password" class="form-control bg-transparent text-white" placeholder="Password"></div>
            <button class="btn btn-outline-info btn-block mt-4" onclick="UI.boot()">LOGIN</button>
            <div id="login-err" class="mt-3 text-danger small mono"></div>
        </div>
    </section>

    <div id="dashboard" class="container">
        <div class="row">
            <div class="col-md-8">
                <div class="web-window mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mono m-0">ACCOUNTS_SNAPSHOT</h5>
                        <button class="btn btn-sm btn-outline-danger" onclick="Client.logout()">Logout</button>
                    </div>
                    <hr class="bg-secondary">
                    <div id="grid-accounts" class="row"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="web-window">
                    <h5 class="mono">OBLIGATIONS</h5>
                    <hr class="bg-secondary">
                    <div id="grid-bills"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="client.js"></script>
    <script>
        const UI = {
            boot: async function() {
                const btn = document.querySelector('#gate button');
                btn.innerText = "WAIT..."; btn.disabled = true;
                
                const success = await Client.login();
                if (success) {
                    Client.showDashboard();
                } else {
                    btn.innerText = "LOGIN"; btn.disabled = false;
                }
            }
        };
    </script>
</body>
</html>
