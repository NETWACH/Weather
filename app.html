<!DOCTYPE html>
<html lang="en">
<head>
    <title>Arc Void | System Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --glass: rgba(10, 10, 20, 0.75); 
            --cyan: #00f2ff; 
            --silver: #c0c0c0; 
            --gold: #d4af37; 
        }
        
        /* 1. THE REALISTIC BACKGROUND */
        body, html { 
            height: 100vh; margin: 0; background: #000; 
            font-family: 'Montserrat', sans-serif; overflow: hidden; 
        }

        .background-fixed {
            position: fixed; inset: 0; z-index: -2;
            background: url('https://images.unsplash.com/photo-1507608869274-d3177c8bb4c7?q=80&w=2070&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
        }

        /* The Blur Layer */
        .background-blur {
            position: fixed; inset: 0; z-index: -1;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
        }

        #gate, #portal { 
            height: 100vh; width: 100%; position: absolute; top: 0; left: 0; 
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1); 
        }
        
        #portal { display: none; opacity: 0; padding: 100px 40px; }

        /* 2. THE METALLIC WINDOWS */
        .system-box { 
            background: var(--glass); border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px; box-shadow: 0 50px 100px rgba(0,0,0,0.8);
        }

        .portal-btn {
            background: rgba(255,255,255,0.03); padding: 25px; border-radius: 12px;
            border: 1px solid var(--silver); transition: 0.3s; cursor: pointer;
        }
        .gold-border { border-color: var(--gold) !important; }
        .portal-btn:hover { background: rgba(0, 242, 255, 0.08); transform: translateY(-5px); border-color: var(--cyan); }

        .mono { font-family: 'Courier New', monospace; color: var(--cyan); font-weight: 700; }
        .tiny { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; }

        /* FORM CONTROLS */
        .form-control { 
            background: rgba(0,0,0,0.6) !important; color: #fff !important; 
            border: 1px solid rgba(255,255,255,0.1) !important; padding: 30px !important; 
            border-radius: 10px !important;
        }
        
        .btn-boot { 
            border: 2px solid var(--cyan); color: var(--cyan); 
            background: transparent; letter-spacing: 6px; padding: 20px; 
            text-transform: uppercase; font-weight: 900; transition: 0.5s;
        }
        .btn-boot:hover { background: var(--cyan); color: #000; box-shadow: 0 0 50px rgba(0, 242, 255, 0.6); }
    </style>
</head>
<body>
    <div class="background-fixed"></div>
    <div class="background-blur"></div>

    <section id="gate" class="d-flex align-items-center justify-content-center">
        <div class="system-box text-center" style="width: 500px;">
            <h1 class="mb-5 text-white" style="letter-spacing: 20px; font-weight: 200;">ARC VOID</h1>
            <div class="form-group mb-3"><input type="email" id="email" class="form-control" placeholder="USER_ID"></div>
            <div class="form-group mb-4"><input type="password" id="password" class="form-control" placeholder="PASSKEY"></div>
            <button class="btn btn-block btn-boot" onclick="UI.start()">BOOT SYSTEM</button>
            <div id="login-err" class="mt-4 text-danger tiny mono"></div>
        </div>
    </section>

    <main id="portal">
        <div class="container">
            <div class="d-flex justify-content-between align-items-end mb-5">
                <div>
                    <h1 class="mono m-0" style="font-size: 40px; color: #fff;">WELCOME_USER</h1>
                    <span class="tiny opacity-50 text-white">PORTAL STATUS: ONLINE // ENCRYPTED_CHANNEL</span>
                </div>
                <button class="btn btn-outline-danger px-5 py-2" style="border-radius:0; font-weight: 800;" onclick="Client.logout()">SHUTDOWN</button>
            </div>

            <div class="row">
                <div class="col-lg-7 mb-4">
                    <div class="system-box h-100">
                        <h5 class="mono mb-4 text-white">FINANCIAL_LEDGER</h5>
                        <div id="grid-accounts" class="row"></div>
                    </div>
                </div>
                <div class="col-lg-5 mb-4">
                    <div class="system-box h-100">
                        <h5 class="mono mb-4 text-white">PANTRY_MANIFEST</h5>
                        <div id="grid-bills" class="mono"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/jquery.min.js"></script>
    <script src="client.js"></script>
    <script>
        const UI = {
            start: async function() {
                const btn = document.querySelector('#gate button');
                btn.innerText = "LINKING IDENTITY..."; btn.disabled = true;
                const success = await Client.login();
                if (success) { Client.showDashboard(); } 
                else { btn.innerText = "BOOT SYSTEM"; btn.disabled = false; }
            }
        };
    </script>
</body>
</html>
