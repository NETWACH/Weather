<!DOCTYPE html>
<html lang="en">
<head>
    <title>Arc Void OS | Desktop</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --panel-bg: rgba(10, 10, 15, 0.9);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --neon-cyan: #00f2ff;
        }

        body, html { 
            height: 100%; margin: 0; background: #000;
            font-family: 'Montserrat', sans-serif; overflow: hidden; 
        }

        /* Spinning Nebula Background */
        .nebula {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.1) 0%, transparent 50%),
                        url('images/bg_1.jpg') no-repeat center center;
            background-size: cover; z-index: -1;
            animation: nebulaSpin 120s linear infinite;
        }

        @keyframes nebulaSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #desktop { height: calc(100vh - 55px); padding: 30px; display: none; position: relative; z-index: 5; }

        .taskbar {
            position: fixed; bottom: 0; width: 100%; height: 55px;
            background: var(--panel-bg); backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; padding: 0 25px; z-index: 10000;
        }

        .system-window {
            position: relative; background: var(--glass-bg); backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6); padding: 25px; color: #fff;
        }

        .system-window::before {
            content: ''; position: absolute; inset: -2px;
            background: conic-gradient(from 0deg, transparent, var(--neon-cyan), transparent 40%);
            border-radius: 14px; z-index: -1;
            animation: rotateGlow 4s linear infinite; opacity: 0; transition: opacity 0.3s;
        }
        .system-window:hover::before { opacity: 1; }

        @keyframes rotateGlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #lock-screen {
            display: none; position: fixed; inset: 0; z-index: 20000;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(60px);
            align-items: center; justify-content: center;
        }

        .mono { font-family: 'Courier New', Courier, monospace; color: var(--neon-cyan); }
    </style>
</head>
<body>

    <div class="nebula"></div>

    <div id="lock-screen">
        <div class="system-window text-center" style="width: 380px;">
            <h3 class="mono mb-4">SYSTEM_LOCKED</h3>
            <input type="password" id="unlock-pass" class="form-control mb-3 bg-dark text-white text-center" placeholder="PIN">
            <button class="btn btn-primary w-100" onclick="OS.unlock()">UNLOCK SESSION</button>
        </div>
    </div>

    <section id="gate" class="h-100 d-flex align-items-center justify-content-center">
        <div class="system-window text-center p-5" style="width: 450px;">
            <h1 class="mb-5" style="letter-spacing: 12px;">ARC VOID</h1>
            <input type="email" id="email" class="form-control mb-4 bg-transparent text-white" placeholder="USER_ID">
            <input type="password" id="password" class="form-control mb-4 bg-transparent text-white" placeholder="ACCESS_KEY">
            <button class="btn btn-outline-info btn-block py-3" onclick="OS.boot()">BOOT SYSTEM</button>
            <div id="login-err" class="mt-3 text-danger mono small"></div>
        </div>
    </section>

    <div id="desktop">
        <div class="row">
            <div class="col-md-8">
                <div class="system-window">
                    <span class="mono">LEDGER_VIEWER.EXE</span>
                    <hr class="bg-secondary">
                    <div id="grid-accounts" class="mono" style="font-size: 12px;">> WAITING FOR AUTHENTICATION...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="taskbar" id="os-panel" style="display: none;">
        <button class="btn btn-info mr-4">ARC</button>
        <div class="flex-grow-1"></div>
        <div class="d-flex align-items-center text-white mono" style="font-size: 13px;">
            <i class="fa fa-lock mx-3" style="cursor: pointer;" onclick="OS.lock()"></i>
            <i class="fa fa-power-off mx-3 text-danger" style="cursor: pointer;" onclick="OS.shutdown()"></i>
            <span id="os-clock" class="ml-3">00:00:00</span>
        </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="client.js"></script>

    <script>
        const OS = {
            boot: async function() {
                const btn = document.querySelector('#gate button');
                btn.innerText = "AUTHENTICATING..."; btn.disabled = true;
                const success = await Client.login();
                if (success) {
                    document.getElementById('gate').style.display = 'none';
                    document.getElementById('desktop').style.display = 'block';
                    document.getElementById('os-panel').style.display = 'flex';
                    this.startClock();
                } else {
                    document.getElementById('login-err').innerText = "INVALID_CREDENTIALS";
                    btn.innerText = "BOOT SYSTEM"; btn.disabled = false;
                }
            },
            lock: function() { document.getElementById('lock-screen').style.display = 'flex'; },
            unlock: function() {
                if(document.getElementById('unlock-pass').value === "1234") {
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('unlock-pass').value = '';
                }
            },
            shutdown: function() { location.reload(); },
            startClock: function() {
                setInterval(() => {
                    document.getElementById('os-clock').innerText = new Date().toLocaleTimeString();
                }, 1000);
            }
        };
    </script>
</body>
</html>
