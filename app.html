<!DOCTYPE html>
<html lang="en">
<head>
    <title>Arc Void OS | Enterprise Desktop</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --panel-bg: rgba(10, 10, 15, 0.95); --glass: rgba(255, 255, 255, 0.08); --cyan: #00f2ff; --silver: #c0c0c0; }
        body, html { height: 100%; margin: 0; background: #050508; font-family: 'Montserrat', sans-serif; overflow: hidden; }
        
        /* Moving Bubbles/Nebula Background */
        .bubble-bg {
            position: fixed; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050508 100%);
            z-index: -1; overflow: hidden;
        }
        .bubble-bg::after {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: radial-gradient(circle, rgba(0, 242, 255, 0.05) 10%, transparent 10.5%);
            background-size: 100px 100px;
            animation: bubbleMove 60s linear infinite;
        }
        @keyframes bubbleMove { from { transform: translate(0,0); } to { transform: translate(-100px, -100px); } }

        #desktop { height: calc(100vh - 55px); padding: 50px; display: none; position: relative; z-index: 5; }
        
        .icon-grid { display: flex; flex-direction: column; gap: 30px; width: 100px; }
        .os-icon { text-align: center; cursor: pointer; transition: 0.2s; }
        .os-icon i { font-size: 40px; color: var(--silver); text-shadow: 0 0 15px var(--cyan); display: block; margin-bottom: 5px; }
        .os-icon span { font-size: 10px; font-family: monospace; color: #fff; }

        .system-window { background: var(--glass); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; }
        .mono { font-family: 'Courier New', monospace; color: var(--cyan); }
        .taskbar { position: fixed; bottom: 0; width: 100%; height: 55px; background: var(--panel-bg); backdrop-filter: blur(30px); border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; padding: 0 25px; z-index: 10000; }
        
        /* Metallic Login Border */
        .login-box { border: 1px solid var(--silver); box-shadow: 0 0 30px rgba(0, 242, 255, 0.1); }
    </style>
</head>
<body>
    <div class="bubble-bg"></div>

    <section id="gate" class="h-100 d-flex align-items-center justify-content-center">
        <div class="system-window login-box text-center p-5" style="width: 400px;">
            <h2 class="mb-5" style="letter-spacing: 10px;">ARC VOID</h2>
            <input type="email" id="email" class="form-control mb-3 bg-transparent text-white border-secondary" placeholder="USER_ID">
            <input type="password" id="password" class="form-control mb-3 bg-transparent text-white border-secondary" placeholder="PASSKEY">
            <button class="btn btn-outline-info btn-block py-2" onclick="OS.boot()">BOOT_SYSTEM</button>
            <div id="login-err" class="mt-3 text-danger mono small"></div>
        </div>
    </section>

    <div id="desktop">
        <div class="icon-grid">
            <div class="os-icon" onclick="Client.tab('ledger')">
                <i class="fa fa-university"></i>
                <span>LEDGER.EXE</span>
            </div>
            <div class="os-icon" onclick="Client.tab('pantry')">
                <i class="fa fa-archive"></i>
                <span>PANTRY.SYS</span>
            </div>
        </div>

        <div class="system-window mt-5 p-4" style="max-width: 600px;">
            <div id="view-ledger" class="view-section">
                <h5 class="mono">ACTIVE_ACCOUNTS</h5>
                <hr class="bg-secondary">
                <div id="grid-accounts" class="row"></div>
            </div>
            <div id="view-pantry" class="view-section" style="display:none;">
                <h5 class="mono">PANTRY_INVENTORY</h5>
                <hr class="bg-secondary">
                <div id="grid-bills"></div>
            </div>
        </div>
    </div>

    <div class="taskbar" id="os-panel" style="display: none;">
        <div class="mono small mr-4">ARC_OS</div>
        <div class="flex-grow-1"></div>
        <i class="fa fa-power-off text-danger mx-3" style="cursor:pointer" onclick="OS.shutdown()"></i>
        <span id="os-clock" class="text-white mono ml-2">00:00:00</span>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="client.js"></script>
    <script>
        const OS = {
            boot: async function() {
                const btn = document.querySelector('#gate button');
                btn.innerText = "VERIFYING..."; btn.disabled = true;
                const success = await Client.login();
                if (success) { Client.launchOS(); }
                else { btn.innerText = "BOOT_SYSTEM"; btn.disabled = false; }
            },
            shutdown: () => { if(confirm("SHUTDOWN OS?")) Client.logout(); },
            startClock: () => { setInterval(() => { document.getElementById('os-clock').innerText = new Date().toLocaleTimeString(); }, 1000); }
        };
    </script>
</body>
</html>
