<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Arc Void | Secure Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <link href="https://fonts.googleapis.com/css?family=Montserrat:200,300,400,500,600,700,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
      .app-container { display: none; } /* Hidden until auth */
      .glass-card { background: #fff; border-radius: 10px; padding: 30px; box-shadow: 0px 10px 30px rgba(0,0,0,0.05); }
      .nav-link { cursor: pointer; }
    </style>
  </head>
  <body>

    <div class="wrap">
      <div class="container">
        <div class="row justify-content-between">
          <div class="col">
            <p class="mb-0"><span class="fa fa-shield mr-1"></span> Secure Terminal: <span id="sys-status">Ready</span></p>
          </div>
          <div class="col text-right">
            <p class="mb-0"><span class="fa fa-clock-o mr-1"></span> Last Sync: <span id="sync-time">Now</span></p>
          </div>
        </div>
      </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
      <div class="container">
        <a class="navbar-brand" href="index.html">Arc Void</a>
        <div class="collapse navbar-collapse" id="ftco-nav">
          <ul class="navbar-nav m-auto">
            <li class="nav-item"><a onclick="Client.tab('ledger')" class="nav-link">Dashboard</a></li>
            <li class="nav-item"><a onclick="Client.tab('bills')" class="nav-link">Obligations</a></li>
            <li class="nav-item"><a onclick="Client.tab('chat')" class="nav-link">Support</a></li>
          </ul>
          <button id="logout-btn" style="display:none;" class="btn btn-primary py-2 px-3" onclick="Client.logout()">Disconnect</button>
        </div>
      </div>
    </nav>

    <section id="gate" class="ftco-section bg-light" style="min-height: 80vh;">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6 col-lg-4">
            <div class="login-wrap p-4 p-md-5 glass-card">
              <h3 class="text-center mb-4">Authenticate</h3>
              <div class="form-group">
                <input type="email" id="email" class="form-control" placeholder="Identity (Email)" required>
              </div>
              <div class="form-group">
                <input type="password" id="password" class="form-control" placeholder="Passkey" required>
              </div>
              <div class="form-group">
                <button type="submit" class="btn btn-primary rounded submit p-3 px-5 w-100" onclick="Client.login()">Enter Portal</button>
              </div>
              <div id="login-err" class="text-danger text-center mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div id="app" class="app-container">
      <section class="ftco-section">
        <div class="container">
          
          <section id="view-ledger">
            <div class="row mb-5">
              <div class="col-md-12">
                <h2 class="heading-section">System Snapshot</h2>
                <p class="muted">Welcome back. Your financial containers are synchronized.</p>
              </div>
            </div>
            <div id="grid-accounts" class="row">
              <p class="pl-3">Loading secure ledger...</p>
            </div>
          </section>

          <section id="view-bills" style="display:none;">
            <div class="row mb-5 justify-content-between align-items-center">
              <div class="col-md-8">
                <h2 class="heading-section">Obligations</h2>
              </div>
              <div class="col-md-4 text-right">
                <button class="btn btn-primary px-4 py-3" onclick="document.getElementById('modal-bill').style.display='block'">+ New Bill</button>
              </div>
            </div>
            <div id="grid-bills" class="row">
              </div>
          </section>

        </div>
      </section>
    </div>

    <div id="modal-bill" class="modal-custom" style="display:none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);">
      <div class="container mt-5">
        <div class="row justify-content-center">
          <div class="col-md-6 glass-card">
            <div class="d-flex justify-content-between mb-4">
              <h4>New Obligation</h4>
              <button class="btn btn-sm btn-dark" onclick="document.getElementById('modal-bill').style.display='none'">X</button>
            </div>
            <div class="form-group">
              <input id="b-name" class="form-control" placeholder="Payee Name">
            </div>
            <div class="row">
              <div class="col-6"><input id="b-amt" type="number" class="form-control" placeholder="Amount"></div>
              <div class="col-6"><input id="b-date" type="date" class="form-control"></div>
            </div>
            <button class="btn btn-primary w-100 mt-4" onclick="Client.addBill()">Save to Ledger</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer py-4 mt-5">
      <div class="container text-center">
        <p class="copyright mb-0">System Status: <span class="text-success">Nominal</span> | Arc Void Core</p>
      </div>
    </footer>

    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="client.js"></script>
  </body>
</html>
