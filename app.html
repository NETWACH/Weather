<!DOCTYPE html>
<html lang="en">
<head>
    <title>Arc Void | System Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --glass: rgba(255, 255, 255, 0.07); --cyan: #00f2ff; --silver: #c0c0c0; }
        
        body, html { 
            height: 100vh; margin: 0; background: #050508; 
            font-family: 'Montserrat', sans-serif; overflow: hidden; 
        }

        /* Moving Bubbles Background */
        .bubble-bg {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 50%, #0d0d1a 0%, #050508 100%);
            z-index: -1;
        }
        .bubble-bg::after {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: radial-gradient(circle, rgba(0, 242, 255, 0.04) 10%, transparent 10.5%);
            background-size: 100px 100px;
            animation: bubbleMove 70s linear infinite;
        }
        @keyframes bubbleMove { from { transform: translate(0,0); } to { transform: translate(-100px, -100px); } }

        /* Gate and Portal Containers */
        #gate, #portal { height: 100vh; width: 100%; position: absolute; top: 0; left: 0; }
        #portal { display: none; overflow-y: auto; padding: 40px 20px; }

        .system-box { 
            background: var(--glass); backdrop-filter: blur(40px); 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; 
            color: #fff; padding: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .portal-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(192, 192, 192, 0.15);
            padding: 20px; border-radius: 10px; transition: 0.3s;
        }
        .portal-card:hover { border-color: var(--cyan); background: rgba(0, 242, 255, 0.05); }

        .mono { font-family: 'Courier New', monospace; color: var(--cyan); }
        .text-cyan { color: var(--cyan); }

        /* Metallic Login Border */
        .login-border { border: 1px solid var(--silver); }
    </style>
</head>
<body>
    <div class="bubble-bg"></div>

    <section id="gate" class="d-flex align-items-center justify-content-center">
        <div class="system-box login-border text-center" style="width: 400px;">
            <h2 class="mb-4" style="letter-spacing: 10px; font-weight: 300;">ARC VOID</h2>
            <div class="form-group"><input type="email" id="email" class="form-control bg-transparent text-white border-secondary" placeholder="USER_ID"></div>
            <div class="form-group"><input type="password" id="password" class="form-control bg-transparent text-white border-secondary" placeholder="PASSKEY"></div>
            <button class="btn btn-outline-info btn-block mt-4 py-2" onclick="UI.start()">BOOT SYSTEM</button>
            <div id="login-err" class="mt-3 text-danger small mono"></div>
        </div>
    </section>

    <main id="portal">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h1 class="mono m-0" style="font-size: 24px;">SYSTEM_PORTAL</h1>
                    <span class="small opacity-50">KINETIC_OS // VER 2.5</span>
                </div>
                <button class="btn btn-sm btn-outline-danger px-4" onclick="Client.logout()">SHUTDOWN</button>
            </div>

            <div class="row">
                <div class="col-lg-8 mb-4">
                    <div class="system-box h-100">
                        <h5 class="mono mb-4"><i class="fa fa-university mr-2"></i> FINANCIAL_LEDGER</h5>
                        <div id="grid-accounts" class="row">
                            </div>
                    </div>
                </div>

                <div class="col-lg-4 mb-4">
                    <div class="system-box h-100">
                        <h5 class="mono mb-4"><i class="fa fa-archive mr-2"></i> PANTRY_MANIFEST</h5>
                        <div id="grid-bills" class="mono small">
                            </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/jquery.min.js"></script>
    <script src="client.js"></script>
    <script>
        const UI = {
            start: async function() {
                const btn = document.querySelector('#gate button');
                btn.innerText = "AUTHENTICATING..."; btn.disabled = true;
                
                const success = await Client.login();
                if (success) {
                    Client.showDashboard();
                } else {
                    btn.innerText = "BOOT SYSTEM"; btn.disabled = false;
                }
            }
        };
    </script>
</body>
</html>
