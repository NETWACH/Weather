<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ARK CLIENT PORTAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fraunces:wght@700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="gate" class="gate">
    <div class="login">
      <div class="loginhead">
        <div style="display:flex; gap:12px; align-items:center;">
          <div class="crest"><i class="fa-solid fa-shield-cat"></i></div>
          <h3>CLIENT PORTAL</h3>
        </div>
      </div>
      <div class="loginbody">
        <input class="input" id="email" type="email" placeholder="Email" />
        <input class="input" id="password" type="password" placeholder="Password" />
        <button class="btn-elite" onclick="Client.login()">SECURE LOGIN</button>
        <div id="login-err" class="err">Login failed.</div>
      </div>
    </div>
  </div>

  <div id="app" class="app-container" style="display:none;">
    <aside class="sidebar glass-panel">
      <div style="text-align:center; padding-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.1);">
        <h1 style="font-family:Fraunces; color:var(--accent-ice);">ARK FINANCE</h1>
        <div class="role-badge" style="background:var(--accent-ice);">CLIENT MODE</div>
      </div>
      <nav>
        <div class="nav-item active" onclick="Client.tab('ledger')"><i class="fa-solid fa-wallet"></i> Accounts</div>
        <div class="nav-item" onclick="Client.tab('bills')"><i class="fa-solid fa-file-invoice"></i> My Bills</div>
        <div class="nav-item" onclick="Client.tab('chat')"><i class="fa-solid fa-comments"></i> Support</div>
      </nav>
      <div style="margin-top:auto;">
        <button class="btn-danger" style="width:100%; justify-content:center;" onclick="Client.logout()">LOGOUT</button>
      </div>
    </aside>

    <main class="glass-panel">
      <section id="view-ledger">
        <div class="toprow"><h2 class="title">My Accounts</h2></div>
        <div id="grid-accounts" class="accounts-grid">Loading...</div>
      </section>

      <section id="view-bills" style="display:none;">
        <div class="toprow">
          <h2 class="title">Bill Tracker</h2>
          <button class="btn-elite" onclick="document.getElementById('modal-bill').style.display='flex'">+ Add Bill</button>
        </div>
        <div id="grid-bills" class="pantry-grid" style="margin-top:20px;"></div>
      </section>

      <section id="view-chat" style="display:none; height:100%; flex-direction:column;">
        <div class="toprow"><h2 class="title">Message Center</h2></div>
        <div id="chat-box" class="chat-container"></div>
        <div class="chat-input-area">
          <input id="chat-input" class="input" placeholder="Message to Admin..." />
          <button class="btn-elite" onclick="Client.sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </section>
    </main>
  </div>

  <div id="modal-bill" class="modal" onclick="if(event.target.id==='modal-bill') this.style.display='none'">
    <div class="sheet">
      <div class="sheethead"><h4>Add Bill</h4></div>
      <div class="sheetbody">
        <input id="b-name" class="input" placeholder="Bill Name (e.g. Rent)" />
        <select id="b-type" class="select"><option value="General">General</option><option value="Utility">Utility</option><option value="Loan">Loan</option></select>
        <input id="b-amt" class="input" type="number" placeholder="Amount Due" />
        <input id="b-date" class="input" type="date" />
        <button class="btn-elite" onclick="Client.addBill()">Save Bill</button>
      </div>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
