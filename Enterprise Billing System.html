<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // REPLACE THESE with the values from your Supabase screenshot
    const SUPABASE_URL = 'https://cumebdvojadpxaxdmabb.supabase.co';
    const SUPABASE_KEY = 'YOUR_PUBLISHABLE_KEY_FROM_SCREENSHOT';
    
    const supabase = lib.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const Portal = {
        async login() {
            const u = document.getElementById('user-id').value;
            const k = document.getElementById('user-key').value;

            // Query Supabase for the user
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('username', u)
                .eq('passcode', k)
                .single();

            if (data) {
                this.user = data.username;
                this.role = data.role;
                document.getElementById('gate-keeper').style.display = 'none';
                document.getElementById('main-interface').style.display = 'block';
                this.sync();
            } else {
                document.getElementById('auth-error').style.display = 'block';
            }
        },

        async sync() {
            // Fetch records from the 'ledger' table
            let query = supabase.from('ledger').select('*');
            
            // Only show user's data if they aren't an Admin
            if (this.role !== 'Admin') {
                query = query.eq('owner', this.user);
            }

            const { data, error } = await query;
            this.data = data || [];
            this.render();
        },

        async save() {
            const payload = {
                description: document.getElementById('e-desc').value,
                amount: document.getElementById('e-amt').value,
                status: document.getElementById('e-status').value,
                owner: this.user
            };

            await supabase.from('ledger').insert([payload]);
            this.closeEditor();
            this.sync();
        }
    };
</script>
