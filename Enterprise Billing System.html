<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEDERAL ASSET COMMAND | v6.0</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff; --neon-gold: #ffcc00; --neon-red: #ff3131;
            --glass: rgba(10, 15, 28, 0.95); --border: rgba(0, 210, 255, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                        url('https://images.unsplash.com/photo-1523973331110-38819582236e?auto=format&fit=crop&q=80&w=2000');
            background-size: cover; background-attachment: fixed; color: #e2e8f0; height: 100vh; overflow: hidden;
        }

        /* --- LOGIN GATE --- */
        #gate-keeper { position: fixed; inset: 0; z-index: 10000; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-card { background: var(--glass); padding: 3rem; border-radius: 20px; border: 1px solid var(--neon-blue); text-align: center; box-shadow: 0 0 50px rgba(0, 210, 255, 0.2); }

        /* --- MAIN DASHBOARD --- */
        #main-interface { display: none; height: 100vh; padding: 2.5rem; overflow-y: auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 2rem; }
        .stat-card { background: var(--glass); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; backdrop-filter: blur(25px); position: relative; }
        .label { font-size: 0.6rem; letter-spacing: 3px; color: var(--neon-blue); font-weight: 800; text-transform: uppercase; }
        .value { font-size: 2.5rem; font-weight: 900; margin-top: 5px; font-family: 'Courier New', monospace; }

        /* --- TABLE --- */
        .db-frame { background: var(--glass); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(0, 210, 255, 0.1); padding: 15px; text-align: left; font-size: 0.7rem; color: var(--neon-blue); }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; }
        tr:hover td { background: rgba(0, 210, 255, 0.1); }

        /* --- MODAL --- */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(15px); }
        .modal-box { background: var(--glass); border: 2px solid var(--neon-blue); padding: 2.5rem; border-radius: 15px; width: 450px; }
        
        /* --- UTILS --- */
        .btn { padding: 12px 25px; border-radius: 6px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
        .blink { animation: blinker 0.8s infinite alternate; }
        @keyframes blinker { from { opacity: 1; color: var(--neon-red); } to { opacity: 0.2; } }
        .role-badge { background: var(--neon-gold); color: #000; padding: 2px 8px; border-radius: 4px; font-size: 0.6rem; margin-left: 10px; }
    </style>
</head>
<body>

    <div id="gate-keeper">
        <div class="login-card">
            <i class="fas fa-shield-halved" style="font-size: 3rem; color: var(--neon-blue); margin-bottom: 1rem;"></i>
            <h2 style="letter-spacing: 5px; margin-bottom: 2rem;">VAULT ACCESS</h2>
            <input type="text" id="user-id" placeholder="USERNAME" style="text-align: center;">
            <input type="password" id="user-key" placeholder="PASSCODE" style="text-align: center;">
            <button class="btn" style="background: var(--neon-blue); width: 100%; color: #000; margin-top: 10px;" onclick="Portal.login()">INITIALIZE SESSION</button>
            <p id="auth-error" style="color: var(--neon-red); margin-top: 10px; display: none;">ACCESS DENIED</p>
        </div>
    </div>

    <div id="main-interface">
        <div class="header-bar">
            <div>
                <h1>LEDGER <span style="color: var(--neon-blue)">COMMAND</span> <span id="role-tag"></span></h1>
                <p id="session-info" style="font-size: 0.7rem; opacity: 0.6;"></p>
            </div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="db-search" placeholder="FILTER LEDGER..." style="width: 250px; margin:0;" oninput="Portal.render()">
                <button class="btn" style="background: var(--neon-blue); color: #000;" onclick="Portal.openEditor()">+ NEW ENTRY</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Total Inflow</div>
                <div id="v-rev" class="value" style="color: var(--neon-blue)">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Outflow</div>
                <div id="v-exp" class="value" style="color: var(--neon-red)">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="label">Liquidity Buffer</div>
                <div id="v-liq" class="value" style="color: var(--neon-gold)">$0.00</div>
            </div>
        </div>

        <div class="db-frame">
            <table>
                <thead><tr><th>UUID</th><th>TIMESTAMP</th><th>DESCRIPTION</th><th>VOLUME</th><th>STATUS</th></tr></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="modal-editor" class="modal">
        <div class="modal-box">
            <h2 id="modal-title" style="color: var(--neon-blue); margin-bottom: 1rem;">ENTRY MANAGEMENT</h2>
            <input type="hidden" id="e-uuid">
            <label>DESCRIPTION</label>
            <input type="text" id="e-desc">
            <label>AMOUNT (USE - FOR EXPENSES)</label>
            <input type="number" id="e-amt">
            <label>STATUS</label>
            <select id="e-status">
                <option value="CLEAR">CLEAR</option>
                <option value="PENDING">PENDING</option>
                <option value="OVERDUE">OVERDUE</option>
            </select>
            <button class="btn" style="background: var(--neon-blue); width: 100%; color: #000;" onclick="Portal.save()">COMMIT TO CLOUD</button>
            <button class="btn" style="background: #334155; width: 100%; margin-top: 10px; color:#fff;" onclick="Portal.closeEditor()">ABORT</button>
        </div>
    </div>

<script>
    const Portal = {
        // REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT URL
        API: 'https://script.google.com/macros/s/AKfycbyW81e7-Z3-TdLtpTkIrGm1SKUsOZmYjOpWgaGHcqGltwGON3e-AbE1rCFmJfer0xBL-A/exec',
        
        user: null,
        role: null,
        data: [],

        async login() {
            const u = document.getElementById('user-id').value;
            const k = document.getElementById('user-key').value;
            
            // Auth request to the "Users" sheet partition
            const res = await fetch(`${this.API}?action=auth&user=${u}&key=${k}`);
            const result = await res.json();
            
            if (result.success) {
                this.user = u;
                this.role = result.role;
                document.getElementById('gate-keeper').style.display = 'none';
                document.getElementById('main-interface').style.display = 'block';
                document.getElementById('session-info').innerText = `SESSION: ${u} // ROLE: ${this.role}`;
                if(this.role === 'ADMIN') document.getElementById('role-tag').innerHTML = '<span class="role-badge">ADMIN PORTAL</span>';
                this.sync();
            } else {
                document.getElementById('auth-error').style.display = 'block';
            }
        },

        async sync() {
            document.getElementById('v-liq').innerText = "...";
            const res = await fetch(`${this.API}?action=read&user=${this.user}&role=${this.role}`);
            this.data = await res.json();
            this.render();
        },

        render() {
            const body = document.getElementById('table-body');
            const search = document.getElementById('db-search').value.toUpperCase();
            let rev = 0, exp = 0;
            body.innerHTML = '';

            const filtered = this.data.filter(i => 
                i.description.toString().toUpperCase().includes(search)
            );

            filtered.forEach(item => {
                const val = parseFloat(item.amount);
                if(val > 0) rev += val; else exp += Math.abs(val);
                
                body.innerHTML += `
                    <tr onclick="Portal.openEditor(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                        <td style="color:var(--neon-blue)">#${item.uuid.toString().slice(-4)}</td>
                        <td>${item.date}</td>
                        <td style="font-weight:bold">${item.description}</td>
                        <td style="color:${val > 0 ? 'var(--neon-blue)':'#f87171'}">${val > 0 ? '+':''}$${Math.abs(val).toFixed(2)}</td>
                        <td class="${item.status==='OVERDUE'?'blink':''}">${item.status}</td>
                    </tr>`;
            });

            document.getElementById('v-rev').innerText = `$${rev.toFixed(2)}`;
            document.getElementById('v-exp').innerText = `$${exp.toFixed(2)}`;
            document.getElementById('v-liq').innerText = `$${(rev - exp).toFixed(2)}`;
        },

        async save() {
            const payload = {
                action: 'upsert',
                uuid: document.getElementById('e-uuid').value || Date.now(),
                description: document.getElementById('e-desc').value,
                amount: document.getElementById('e-amt').value,
                status: document.getElementById('e-status').value,
                date: new Date().toLocaleDateString(),
                owner: this.user
            };

            this.closeEditor();
            document.getElementById('v-liq').innerText = "SYNCING...";
            await fetch(this.API, { method: 'POST', body: JSON.stringify(payload) });
            this.sync();
        },

        openEditor(item = null) {
            document.getElementById('modal-editor').style.display = 'flex';
            if(item) {
                document.getElementById('e-uuid').value = item.uuid;
                document.getElementById('e-desc').value = item.description;
                document.getElementById('e-amt').value = item.amount;
                document.getElementById('e-status').value = item.status;
            } else {
                document.getElementById('e-uuid').value = '';
                document.getElementById('e-desc').value = '';
                document.getElementById('e-amt').value = '';
            }
        },

        closeEditor() { document.getElementById('modal-editor').style.display = 'none'; }
    };
</script>
</body>
</html>
