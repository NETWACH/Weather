<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>ARC VOID | God Mode</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:wght@600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Admin-Specific Overrides */
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      padding: 20px;
    }
    .data-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 30px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 10px;
    }
    th {
      text-align: left;
      padding: 15px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    td {
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-family: var(--mono);
      font-size: 13px;
    }
    td:first-child { border-radius: 15px 0 0 15px; border-left: 1px solid rgba(255, 255, 255, 0.05); }
    td:last-child { border-radius: 0 15px 15px 0; border-right: 1px solid rgba(255, 255, 255, 0.05); }
  </style>
</head>
<body class="admin-theme">

  <div class="app-container">
    
    <aside class="sidebar glass-panel">
      <div style="margin-bottom: 40px; text-align: left; padding-left: 10px;">
        <h2 style="font-family: 'Fraunces'; margin: 0; color: var(--accent-ruby);">GOD MODE</h2>
        <span class="muted" style="font-size: 10px; letter-spacing: 2px;">ADMIN TERMINAL</span>
      </div>

      <nav>
        <div class="nav-item active" onclick="location.reload()">
          <i class="fa-solid fa-users-gear"></i> User Logic
        </div>
        <div class="nav-item" onclick="window.location.href='app.html'">
          <i class="fa-solid fa-house"></i> Exit Terminal
        </div>
      </nav>

      <div style="margin-top:auto;">
        <button class="btn-elite" style="width:100%; justify-content:center;" onclick="Admin.sync()">
          <i class="fa-solid fa-rotate"></i> SYNC DATA
        </button>
      </div>
    </aside>

    <main style="overflow-y: auto;">
      <section class="admin-grid">
        
        <div class="toprow">
          <div>
            <h2 class="title">System Users</h2>
            <p class="muted">Override permissions and monitor access logs.</p>
          </div>
        </div>

        <div class="data-card">
          <table>
            <thead>
              <tr>
                <th>Identity</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="user-table">
              <tr>
                <td colspan="4" class="muted" style="text-align:center;">Initiating orbital scan...</td>
              </tr>
            </tbody>
          </table>
        </div>

      </section>
    </main>
  </div>

  <script>
    const Admin = {
      async sync() {
        // Implementation for refreshing user data from Supabase
        console.log("Synchronizing with central intelligence...");
      }
    };
  </script>
</body>
</html>
