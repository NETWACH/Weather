<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ARK GOD MODE</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-theme">

  <div class="god-layout">
    <aside class="sidebar glass-panel">
      <div class="titlebar">
        <div class="traffic"><span class="tl close"></span><span class="tl min"></span><span class="tl max"></span></div>
      </div>
      <div style="padding-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.1); text-align:center;">
        <h2 style="font-family:Fraunces; color:var(--accent-gold);">OVERWATCH</h2>
        <div class="muted" style="font-size:10px; letter-spacing:2px; text-transform:uppercase;">Admin Console</div>
      </div>
      <div id="user-list" class="user-list">Loading subjects...</div>
      <button class="btn-danger" style="margin-top:auto; justify-content:center;" onclick="Admin.logout()">
        <i class="fa-solid fa-lock"></i> SECURE LOGOUT
      </button>
    </aside>

    <main class="glass-panel" id="main-panel" style="display:none;">
      <div class="titlebar">
        <div class="titlebar-title" style="color:var(--accent-gold);">God Mode Active</div>
      </div>
      
      <div style="padding: 30px 30px 0;">
        <div class="toprow" style="margin-bottom:10px;">
          <div>
             <h1 class="title" id="m-email">User</h1>
             <div class="subtitle mono muted" id="m-uid" style="font-size:12px;">ID</div>
          </div>
          <div style="display:flex; gap:10px;">
             <button class="btn-elite" onclick="Admin.modalAccount()"><i class="fa-solid fa-plus"></i> Account</button>
             <button class="btn-ghost" onclick="Admin.modalTransfer()"><i class="fa-solid fa-money-bill-transfer"></i> Transfer</button>
          </div>
        </div>

        <div style="display:flex; gap:10px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:15px; margin-bottom:20px;">
           <button class="btn-ghost" onclick="Admin.view('accounts')">Accounts</button>
           <button class="btn-ghost" onclick="Admin.view('bills')">Bills</button>
           <button class="btn-ghost" onclick="Admin.view('chat')">Intercepts</button>
        </div>
      </div>

      <section id="view-accounts">
        <div class="accounts-grid" id="grid-accounts-target"></div>
      </section>

      <section id="view-bills" style="display:none;">
        <div id="grid-bills-target" class="pantry-grid"></div>
      </section>
      
      <section id="view-chat" style="display:none;">
        <div id="chat-stream" class="chat-container"></div>
        <div id="admin-chat-input" class="chat-input-area">
            <input id="msg-in" class="input" placeholder="Broadcast message..." />
            <button class="btn-elite" onclick="Admin.sendMsg()">SEND</button>
        </div>
      </section>

    </main>
  </div>

  <div id="modal-acc" class="modal" onclick="if(event.target.id==='modal-acc') this.style.display='none'">
     <div class="sheet">
        <div class="sheethead"><h4>Provision Account</h4></div>
        <div class="sheetbody">
           <input id="new-acc-name" class="input" placeholder="Designation (e.g. Cayman Offshore)" />
           <select id="new-acc-cat" class="select"><option value="Personal">Personal</option><option value="Business">Business</option></select>
           <button class="btn-elite" style="justify-content:center;" onclick="Admin.createAccount()">CREATE ASSET</button>
        </div>
     </div>
  </div>

  <div id="modal-tx" class="modal" onclick="if(event.target.id==='modal-tx') this.style.display='none'">
     <div class="sheet">
        <div class="sheethead"><h4>Wire Transfer</h4></div>
        <div class="sheetbody">
           <div class="muted" style="font-size:11px; text-transform:uppercase;">Source Hash</div>
           <input id="tx-from" class="input" placeholder="Origin UUID" />
           <div class="muted" style="font-size:11px; text-transform:uppercase;">Target Hash</div>
           <input id="tx-to" class="input" placeholder="Destination UUID" />
           <input id="tx-amt" class="input" type="number" placeholder="Volume (USD)" />
           <button class="btn-elite" style="justify-content:center;" onclick="Admin.transfer()">EXECUTE</button>
        </div>
     </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
