<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ARK GOD MODE</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* Specific overrides for God Mode */
    .god-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; height: 100vh; padding: 20px; }
    .user-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-right: 10px; }
    .user-card { 
      padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.03); 
      border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s;
    }
    .user-card:hover, .user-card.active { background: rgba(255,255,255,0.08); border-color: var(--accent-gold); }
    .user-email { font-size: 13px; font-weight: 800; color: #fff; }
    .user-id { font-size: 10px; font-family: var(--mono); color: var(--muted); margin-top: 4px; }
    
    .action-bar { display: flex; gap: 10px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    
    .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  </style>
</head>
<body class="admin-theme">

  <div id="app" class="god-layout">
    
    <aside class="sidebar glass-panel">
      <div style="padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px;">
        <h2 style="margin:0; font-size:18px; color:var(--accent-gold);">USERS</h2>
        <div class="muted" style="font-size:11px;">Select a user to manage</div>
      </div>
      <div id="user-list" class="user-list">
        <div class="muted">Loading users...</div>
      </div>
      <div style="margin-top:auto; padding-top:15px; border-top:1px solid rgba(255,255,255,0.1);">
        <a href="index.html" class="btn-ghost" style="width:100%; justify-content:center; font-size:12px;">Back to App</a>
      </div>
    </aside>

    <main class="glass-panel" id="main-panel" style="display:flex; flex-direction:column;">
      <div id="welcome-msg" style="margin:auto; text-align:center; color:var(--muted);">
        <i class="fa-solid fa-users-viewfinder" style="font-size:48px; margin-bottom:20px;"></i><br>
        Select a user on the left to view their accounts.
      </div>

      <div id="manage-view" style="display:none; height:100%; flex-direction:column;">
        <div class="toprow" style="margin-bottom:20px;">
          <div>
            <h1 class="title" id="m-email">user@email.com</h1>
            <div class="subtitle mono" id="m-uid">ID: ...</div>
          </div>
          <div class="row">
            <button class="btn-elite" onclick="God.openCreateAccount()">+ Add Account</button>
            <button class="btn-ghost" onclick="God.openTransfer()">Global Transfer</button>
          </div>
        </div>

        <div id="user-accounts-grid" class="accounts-grid"></div>
      </div>
    </main>

  </div>

  <div id="modal-create" class="modal" onclick="if(event.target.id === 'modal-create') this.style.display='none'">
    <div class="sheet">
      <div class="sheethead"><h4>Create Account</h4></div>
      <div class="sheetbody">
        <div class="label">Target User</div>
        <input id="new-acc-email" class="input" disabled style="opacity:0.5;" />
        <div class="label">Account Name</div>
        <input id="new-acc-name" class="input" placeholder="e.g. Investment Fund" />
        <div class="label">Category</div>
        <select id="new-acc-cat" class="select">
          <option value="Personal">Personal</option>
          <option value="Business">Business</option>
          <option value="Loan">Loan</option>
        </select>
        <button class="btn-elite" onclick="God.createAccount()">Confirm Create</button>
      </div>
    </div>
  </div>

  <div id="modal-transfer" class="modal" onclick="if(event.target.id === 'modal-transfer') this.style.display='none'">
    <div class="sheet large-sheet">
      <div class="sheethead"><h4>Global Transfer (God Mode)</h4></div>
      <div class="sheetbody">
        
        <div style="display:grid; grid-template-columns: 1fr 40px 1fr; gap:10px; align-items:center;">
          <div style="background:rgba(255,0,0,0.1); padding:10px; border-radius:12px;">
            <div class="label" style="color:#ff6b81;">SOURCE (FROM)</div>
            <select id="gx-user-from" class="select" onchange="God.loadAccountsForSelect(this.value, 'gx-acc-from')">
              <option value="">Select User...</option>
            </select>
            <select id="gx-acc-from" class="select" style="margin-top:8px;"></select>
          </div>

          <div style="text-align:center;"><i class="fa-solid fa-arrow-right"></i></div>

          <div style="background:rgba(0,255,163,0.1); padding:10px; border-radius:12px;">
             <div class="label" style="color:#00ffa3;">DESTINATION (TO)</div>
             <select id="gx-user-to" class="select" onchange="God.loadAccountsForSelect(this.value, 'gx-acc-to')">
                <option value="">Select User...</option>
             </select>
             <select id="gx-acc-to" class="select" style="margin-top:8px;"></select>
          </div>
        </div>

        <div class="label">Transaction Details</div>
        <div class="row">
           <input id="gx-amt" class="input" type="number" placeholder="Amount" style="font-size:18px; font-weight:bold;" />
           <input id="gx-desc" class="input" placeholder="Description / Memo" style="flex:2;" />
        </div>
        
        <button class="btn-elite" onclick="God.executeTransfer()" style="margin-top:20px; width:100%; justify-content:center;">EXECUTE TRANSFER</button>

      </div>
    </div>
  </div>

  <script src="god_mode.js"></script>
</body>
</html>
